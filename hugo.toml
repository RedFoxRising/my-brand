# --------------------------------
# 📑 OUTPUT FORMATS 📑
# --------------------------------
# Don't change unless you know what you're doing
[outputs]
  home = ["HTML", "RSS", "JSON"]

# --------------------------------
# 🗺️ SITE MAP 🗺️
# --------------------------------
# Don't change unless you know what you're doing
[sitemap]
  changefreq = "monthly"

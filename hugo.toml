# --------------------------------
# 🔄 FORK SETUP: MUST CHANGE VALUES 🔄
# --------------------------------

# ⚠️ CHANGE THIS: Update to your GitHub Pages URL
# For username.github.io repos: baseURL = "https://username.github.io/"
# For project repos: baseURL = "https://username.github.io/repo-name/"
baseURL = "https://mauroguerrero.com/"

# ⚠️ CHANGE THIS: Update with your name
title = "Mauricio Guerrero - Personal Site"

# Don't change these unless you have a reason to
theme = "PaperMod"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true  # This fixes multilingual URL routing with path-based baseURLs

# --------------------------------
# ⚙️ THEME PARAMS (ALL LANGUAGES) ⚙️
# --------------------------------
# Root-level params apply to every language; each language can override them
# in its own [languages.xx.params] block.
[params]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  displayFullLangName = true

  # Sections listed on the home page. Without this Hugo picks the single
  # section with the most pages, which left projects out.
  mainSections = ["posts", "projects"]

  # Header logo text only. The full site title (used in <title>, RSS and SEO)
  # stays as configured per language below.
  [params.label]
    text = "Mauricio Guerrero"

  # Point PaperMod's fixed icon tags at the files that actually exist in static/.
  # The generated set uses a single 96x96 PNG instead of separate 16x16 / 32x32.
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-96x96.png"
    favicon32x32 = "/favicon-96x96.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#16181B"
    msapplication_TileColor = "#16181B"

# --------------------------------
# 🌐 LANGUAGE: ENGLISH 🌐
# --------------------------------
[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1
    # ⚠️ CHANGE THIS: Update with your name
    title = "Mauricio Guerrero - Personal Site"
    contentDir = "content/en"

    [languages.en.params]
      # ⚠️ CHANGE THIS: Update with your name
      author = "Andres Mauricio Guerrero Avila"
      # ⚠️ CHANGE THIS: Update with your own description
      description = "Economist at a2censo (bvc — nuam). Econometrics, forecasting, and data analytics for financial markets and fintech."

      [languages.en.params.homeInfoParams]
        Title = "Econometrics for credit and financial markets"
        Content = """
Economist at a2censo (bvc — nuam). Forecasting, credit analytics, and applied causal inference.

[Download my CV (PDF)](/cv/mauricio-guerrero-cv-en.pdf)
"""

    # ⚠️ CHANGE THESE: Update with your own social links
    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/RedFoxRising"

    [[languages.en.params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/andresmauricioguerrero/"

    [[languages.en.params.socialIcons]]
      name = "email"
      url = "mailto:am.guerreroa@uniandes.edu.co"

    [[languages.en.params.socialIcons]]
      name = "rss"
      url = "index.xml"

    # Menu items - generally you don't need to change these
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "/posts/"
      weight = 20

    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      url = "/projects/"
      weight = 30

    [[languages.en.menu.main]]
      identifier = "now"
      name = "Now"
      url = "/now/"
      weight = 40

    [[languages.en.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "/contact/"
      weight = 50

# --------------------------------
# 🌐 LANGUAGE: SPANISH (OPTIONAL) 🌐
# --------------------------------
  [languages.es]
    locale = "es"
    label = "Español"
    weight = 2
    # ⚠️ CHANGE THIS: Update with your name
    title = "Mauricio Guerrero - Sitio Personal"
    contentDir = "content/es"

    [languages.es.params]
      # ⚠️ CHANGE THIS: Update with your name
      author = "Andres Mauricio Guerrero Avila"
      # ⚠️ CHANGE THIS: Update with your own description
      description = "Economista en a2censo (bvc — nuam). Econometría, pronósticos y analítica de datos para mercados financieros y fintech."

      [languages.es.params.homeInfoParams]
        Title = "Econometría para crédito y mercados financieros"
        Content = """
Economista en a2censo (bvc — nuam). Pronósticos, analítica de crédito e inferencia causal aplicada.

[Descargar mi CV (PDF)](/cv/mauricio-guerrero-cv-es.pdf)
"""

    # ⚠️ CHANGE THESE: Update with your own social links
    [[languages.es.params.socialIcons]]
      name = "github"
      url = "https://github.com/RedFoxRising"

    [[languages.es.params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/andresmauricioguerrero/"

    [[languages.es.params.socialIcons]]
      name = "email"
      url = "mailto:am.guerreroa@uniandes.edu.co"

    [[languages.es.params.socialIcons]]
      name = "rss"
      url = "index.xml"

    # Menu items - generally you don't need to change these
    [[languages.es.menu.main]]
      identifier = "about"
      name = "Acerca de"
      url = "/about/"  # Removed /es/ prefix - Hugo adds it automatically
      weight = 10

    [[languages.es.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "/posts/"  # Removed /es/ prefix - Hugo adds it automatically
      weight = 20

    [[languages.es.menu.main]]
      identifier = "projects"
      name = "Proyectos"
      url = "/projects/"  # Removed /es/ prefix - Hugo adds it automatically
      weight = 30

    [[languages.es.menu.main]]
      identifier = "now"
      name = "Ahora"
      url = "/now/"  # Removed /es/ prefix - Hugo adds it automatically
      weight = 40

    [[languages.es.menu.main]]
      identifier = "contact"
      name = "Contacto"
